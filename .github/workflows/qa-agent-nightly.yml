name: QA Agent — Nightly Run

on:
  schedule:
    # Run at 2 AM UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source reference (e.g. jira:QA-123)'
        required: false
        type: string
      dry_run:
        description: 'Dry run only (no LLM calls)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Run unit tests + eval harness (regression gate for agents)
  # --------------------------------------------------------------------------
  test:
    name: Tests + Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run eval harness
        run: python -m qa_agent.eval.run_eval

  # --------------------------------------------------------------------------
  # Job 2: Nightly QA agent run (only after tests pass)
  # --------------------------------------------------------------------------
  nightly-run:
    name: Nightly Agent Run
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright
        run: |
          npm init -y
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Run QA Agent (dry run)
        if: ${{ inputs.dry_run || false }}
        run: python -m qa_agent.cli run --dry
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

      - name: Run QA Agent
        if: ${{ !inputs.dry_run && inputs.source }}
        run: python -m qa_agent.cli run --source "${{ inputs.source }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-agent-results
          path: |
            tests_generated/
            page_objects/
            test-results/
            playwright-report/
            metrics.db
          retention-days: 30
