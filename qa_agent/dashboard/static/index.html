<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="header-title">QA COMMAND CENTER</h1>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span class="live-text">LIVE</span>
      </div>
    </div>
    <div class="header-right">
      <span class="timestamp" id="timestamp"></span>
    </div>
  </header>

  <!-- Section 1: Health Gauge + Domain Cards -->
  <section class="section section-health">
    <div class="health-gauge-container">
      <h2 class="section-title">SYSTEM HEALTH</h2>
      <div id="health-gauge" class="health-gauge">
        <svg viewBox="0 0 200 200" class="gauge-svg">
          <circle cx="100" cy="100" r="85" class="gauge-bg" />
          <circle cx="100" cy="100" r="85" class="gauge-fg" id="gauge-arc"
            stroke-dasharray="534" stroke-dashoffset="534" />
          <text x="100" y="90" class="gauge-score" id="gauge-score">--</text>
          <text x="100" y="115" class="gauge-status" id="gauge-status">LOADING</text>
        </svg>
      </div>
      <div class="health-meta">
        <div class="meta-item">
          <span class="meta-label">Total Tests</span>
          <span class="meta-value" id="total-tests">--</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Passed</span>
          <span class="meta-value status-healthy" id="total-passed">--</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Failed</span>
          <span class="meta-value status-critical" id="total-failed">--</span>
        </div>
      </div>
    </div>
    <div class="domain-cards-container">
      <h2 class="section-title">DOMAIN STATUS</h2>
      <div class="domain-grid" id="domain-grid">
        <!-- Domain cards rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Section 2: Agent Eval Cards -->
  <section class="section section-eval">
    <div class="section-header-row">
      <h2 class="section-title">AGENT EVALUATION</h2>
      <div class="eval-header-right">
        <button class="eval-all-btn" id="btn-eval-all">&#9654; EVAL ALL</button>
        <button class="eval-stop-btn" id="btn-eval-stop" style="display:none;">&#9632; STOP</button>
        <span class="eval-status-dot" id="eval-dot"></span>
        <span class="eval-status-text" id="eval-status"></span>
      </div>
    </div>
    <div class="eval-grid" id="eval-grid">
      <!-- Agent eval cards rendered by JS -->
    </div>
  </section>

  <!-- Section 2b: ECC Development Agent Evals -->
  <section class="section section-ecc-eval">
    <div class="section-header-row">
      <h2 class="section-title">DEVELOPMENT AGENT EVALS</h2>
      <div class="eval-header-right">
        <button class="eval-all-btn" id="btn-ecc-eval-all">&#9654; EVAL ECC AGENTS</button>
        <span class="eval-status-dot" id="ecc-eval-dot"></span>
        <span class="eval-status-text" id="ecc-eval-status"></span>
      </div>
    </div>
    <h3 class="ecc-tier-title">DETECTION AGENTS</h3>
    <div class="ecc-eval-grid" id="ecc-detection-grid">
      <!-- Detection agent cards rendered by JS -->
    </div>
    <h3 class="ecc-tier-title">GENERATIVE AGENTS</h3>
    <div class="ecc-eval-grid" id="ecc-generative-grid">
      <!-- Generative agent cards rendered by JS -->
    </div>
  </section>

  <!-- Section 3: Test Runner + Run History -->
  <section class="section section-history">
    <!-- Test Runner (left column) -->
    <div class="runner-card">
      <div class="runner-header">
        <h2 class="section-title">TEST RUNNER</h2>
        <div class="runner-header-right">
          <button class="runner-btn-clear" id="btn-clear">CLEAR</button>
          <span class="runner-status-dot" id="runner-dot"></span>
          <span class="runner-status-text" id="runner-status">IDLE</span>
        </div>
      </div>
      <!-- Options bar -->
      <div class="runner-top-bar">
        <div class="runner-options">
          <div class="runner-option-group">
            <span class="runner-option-label">Workers</span>
            <div class="pill-group" id="worker-pills">
              <button class="pill" data-value="1">1</button>
              <button class="pill" data-value="2">2</button>
              <button class="pill active" data-value="3">3</button>
              <button class="pill" data-value="4">4</button>
            </div>
          </div>
          <div class="runner-option-group">
            <span class="runner-option-label">Retries</span>
            <div class="pill-group" id="retry-pills">
              <button class="pill active" data-value="0">0</button>
              <button class="pill" data-value="1">1</button>
            </div>
          </div>
          <div class="runner-option-group">
            <span class="runner-option-label">Self-Heal</span>
            <div class="pill-group">
              <button class="pill" id="heal-off" data-heal="false">OFF</button>
              <button class="pill active" id="heal-on" data-heal="true">ON</button>
            </div>
            <input type="checkbox" id="heal-toggle" checked style="display:none;">
          </div>
        </div>
        <div class="runner-actions">
          <button class="runner-btn runner-btn-run" id="btn-run-selected">&#9654; RUN SELECTED</button>
          <button class="runner-btn runner-btn-run runner-btn-primary" id="btn-run-all">&#9654; RUN ALL</button>
          <button class="runner-btn runner-btn-stop" id="btn-stop" style="display:none;">&#9632; STOP</button>
        </div>
      </div>

      <!-- Domain list with per-domain progress -->
      <div class="runner-domain-list" id="runner-domain-list">
        <!-- Populated by JS -->
      </div>

      <!-- Log output (expandable) -->
      <div class="runner-log-container" id="runner-log-container" style="display:none;">
        <div class="runner-log-header" id="runner-log-toggle">CONSOLE OUTPUT ▾</div>
        <div class="runner-log" id="runner-log"></div>
      </div>
    </div>

    <!-- Run History (right column) -->
    <div class="history-container" style="width: 100%;">
      <h2 class="section-title">RUN HISTORY</h2>
      <div class="table-wrapper">
        <table class="run-table" id="run-table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Tests</th>
              <th>Passed</th>
              <th>Failed</th>
              <th>Health %</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="run-table-body">
            <!-- Rows rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Scan line overlay -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
